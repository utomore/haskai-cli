[package]
name = "haskai-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "haskai_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "haskai-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
