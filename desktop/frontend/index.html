<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haskai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header">
    <h1>Haskai</h1>
    <span class="chip session" id="chip-session">Default</span>
    <span class="chip model"   id="chip-model">—</span>
    <span id="spacer"></span>
    <span id="status" class="idle">● 就緒</span>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div id="autocomplete"></div>
    <div id="input-row">
      <textarea
        id="user-input"
        rows="1"
        placeholder="輸入訊息，或 / 開頭使用命令…"
        autofocus
      ></textarea>
      <button id="send-btn" type="button">送出</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
