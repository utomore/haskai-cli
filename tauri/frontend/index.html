<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haskai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Haskai</h1>
      <div id="status" class="status idle">● 就緒</div>
    </header>

    <div id="messages" class="messages"></div>

    <form id="input-form" class="input-area">
      <textarea
        id="user-input"
        placeholder="輸入訊息…（Enter 送出，Shift+Enter 換行）"
        rows="3"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn">送出</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
